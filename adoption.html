<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="A safe and loving home for parrots in need." />

    <title>Feathered Friends Parrot Rescue</title>
</head>

<body>
    <div id="site-header"></div>
    <img class="fixed-leaves fixed-leaves--top-left" src="/images/top.png" alt="" aria-hidden="true">

    <img class="fixed-leaves fixed-leaves--bottom-right" src="/images/bottom.png" alt="" aria-hidden="true">
    <main>
        <section class="hero adoption-hero" id="adoption">
            <div class="parallax-layer background-layer"></div>

            <div class="adoption-content">
                <header class="adoption-header">
                    <p class="eyebrow">Meet the flock</p>
                    <h1>Choose a parrot type</h1>
                    <p>Select a category to meet the birds currently in our care.</p>
                
                    <a class="hero-button adoption-application-button" href="./adoption-form.html">
                        Start an adoption application
                    </a>
                </header>

                <div class="category-grid">
                    <a class="category-card" href="./birds.html?category=african-greys">
                        <img src="./src/assets/greys.png" alt="African Grey parrots">
                        <h2>African Greys</h2>
                    </a>

                    <a class="category-card" href="./birds.html?category=amazons">
                        <img src="./src/assets/amazons.png" alt="Amazon parrots">
                        <h2>Amazons</h2>
                    </a>

                    <a class="category-card" href="./birds.html?category=cockatiels">
                        <img src="./src/assets/tiels.png" alt="Cockatiels">
                        <h2>Cockatiels</h2>
                    </a>

                    <a class="category-card" href="./birds.html?category=cockatoos">
                        <img src="./src/assets/toos.png" alt="Cockatoos">
                        <h2>Cockatoos</h2>
                    </a>

                    <a class="category-card" href="./birds.html?category=conures">
                        <img src="/src/assets/conures.png" alt="Conures">
                        <h2>Conures</h2>
                    </a>

                    <a class="category-card" href="./birds.html?category=macaws">
                        <img src="./src/assets/macaws.png" alt="Macaws">
                        <h2>Macaws</h2>
                    </a>

                    <a class="category-card" href="./birds.html?category=parakeets">
                        <img src="./src/assets/budgies.png" alt="Parakeets">
                        <h2>Parakeets</h2>
                    </a>

                    <a class="category-card" href="./birds.html?category=others">
                        <img src="./src/assets/eclectus.png" alt="Other birds">
                        <h2>Other Parrots</h2>
                    </a>
                </div>
            </div>


        </section>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
