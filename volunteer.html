<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="A safe and loving home for parrots in need." />

    <title>Feathered Friends Parrot Rescue</title>
</head>

<body>
    <div id="site-header"></div>
    <img class="fixed-leaves fixed-leaves--top-left" src="/images/top.png" alt="" aria-hidden="true">

    <img class="fixed-leaves fixed-leaves--bottom-right" src="/images/bottom.png" alt="" aria-hidden="true">
    <main>
        <section class="hero adoption-hero" id="volunteer">
            <div class="parallax-layer background-layer"></div>

            <div class="adoption-content">
                <header class="adoption-header">
                    <p class="eyebrow">Join the flock</p>
                    <h1>Put your passion for parrots into action</h1>
                    <p>Fill out the volunteer application to get started.</p>
                </header>
            </div>
        </section>

    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
