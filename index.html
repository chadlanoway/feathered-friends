<!doctype html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P2HZZ3EH9V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-P2HZZ3EH9V');
  </script>

  <link rel="shortcut icon" href="./favicon.ico" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="A safe and loving home for parrots in need." />
  <link rel="stylesheet" href="/src/style.css">
  <title>Feathered Friends Parrot Rescue</title>
</head>

<body>
  <div id="site-header"></div>
  <main>
    <section class="hero" id="home">
      <div class="parallax-layer background-layer"></div>

      <img class="parallax-layer bird-layer" src="/images/parrot.png"
        alt="Colorful macaws flying over a tropical rainforest" />

      <div class="hero-content">
        <p class="eyebrow">Rescue • Rehabilitate • Rehome</p>

        <h1>Giving parrots a life worth living</h1>

        <p class="hero-description">
          Providing compassionate care and finding loving homes
          for parrots in need.
        </p>

        <a class="hero-button" href="#mission">Read the latest</a>
      </div>

      <picture>
        <source media="(max-width: 700px)" srcset="/images/fore-mobile.png" />

        <img class="parallax-layer foreground-layer" src="/images/fore.png" alt="" />
      </picture>

      <div class="scroll-indicator">
        <span>Scroll to explore</span>
        <span class="arrow">↓</span>
      </div>
    </section>

    <section class="mission blog-home" id="mission" aria-labelledby="blog-heading">
      <img class="mission-logo" src="/images/fflogo.png" alt="Feathered Friends logo" />

      <div class="content-wrapper blog-intro">
        <p class="eyebrow">News from the sanctuary</p>
        <h2 id="blog-heading">The Bird Log</h2>

      </div>
      <div id="blog-posts" class="blog-posts" aria-live="polite">
        <p class="blog-empty">Loading stories…</p>
      </div>

    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
